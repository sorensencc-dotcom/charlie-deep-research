<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="800" viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Barlow+Condensed:wght@400;600;700&family=Libre+Baskerville:wght@400;700&display=swap');
      .title { font-family: 'Playfair Display', serif; font-size: 28px; font-weight: 700; fill: #E8E0D4; }
      .label { font-family: 'Barlow Condensed', sans-serif; font-size: 14px; font-weight: 600; fill: #9A9088; letter-spacing: 0.05em; }
      .box { stroke: #B8922A; stroke-width: 2; fill: none; }
      .node { fill: #C4501A; }
      .connector { stroke: #B8922A; stroke-width: 1.5; fill: none; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#B8922A"/>
    </marker>
  </defs>
  <rect width="1200" height="800" fill="#1A1410"/>
  <text class="title" x="40" y="50">Control Plane Internal Routing</text>
  <rect class="box" x="450" y="150" width="140" height="100"/>
  <text class="label" x="520" y="195" text-anchor="middle">Control</text>
  <text class="label" x="520" y="215" text-anchor="middle">Plane</text>
  <rect class="box" x="150" y="200" width="100" height="80"/>
  <text class="label" x="200" y="245" text-anchor="middle">Policies</text>
  <line class="connector" x1="250" y1="240" x2="450" y2="240" marker-end="url(#arrowhead)"/>
  <rect class="box" x="150" y="350" width="100" height="80"/>
  <text class="label" x="200" y="395" text-anchor="middle">Rules</text>
  <line class="connector" x1="250" y1="390" x2="450" y2="390" marker-end="url(#arrowhead)"/>
  <circle class="node" cx="900" cy="200" r="25"/>
  <text class="label" x="900" y="205" text-anchor="middle">DP1</text>
  <line class="connector" x1="590" y1="200" x2="875" y2="200" marker-end="url(#arrowhead)"/>
  <circle class="node" cx="900" cy="350" r="25"/>
  <text class="label" x="900" y="355" text-anchor="middle">DP2</text>
  <line class="connector" x1="590" y1="350" x2="875" y2="350" marker-end="url(#arrowhead)"/>
  <rect class="box" x="300" y="500" width="100" height="80"/>
  <text class="label" x="350" y="545" text-anchor="middle">Sync Status</text>
</svg>
<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="800" viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Barlow+Condensed:wght@400;600;700&family=Libre+Baskerville:wght@400;700&display=swap');
      .title { font-family: 'Playfair Display', serif; font-size: 28px; font-weight: 700; fill: #E8E0D4; }
      .label { font-family: 'Barlow Condensed', sans-serif; font-size: 14px; font-weight: 600; fill: #9A9088; letter-spacing: 0.05em; }
      .box { stroke: #B8922A; stroke-width: 2; fill: none; }
      .node { fill: #C4501A; }
      .connector { stroke: #B8922A; stroke-width: 1.5; fill: none; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#B8922A"/>
    </marker>
  </defs>
  <rect width="1200" height="800" fill="#1A1410"/>
  <text class="title" x="40" y="50">Harvester Pipeline</text>
  <rect class="box" x="100" y="250" width="100" height="100"/>
  <text class="label" x="150" y="305" text-anchor="middle">Fetch</text>
  <rect class="box" x="300" y="250" width="100" height="100"/>
  <text class="label" x="350" y="305" text-anchor="middle">Parse</text>
  <rect class="box" x="500" y="250" width="100" height="100"/>
  <text class="label" x="550" y="305" text-anchor="middle">Validate</text>
  <rect class="box" x="700" y="250" width="100" height="100"/>
  <text class="label" x="750" y="305" text-anchor="middle">Enrich</text>
  <rect class="box" x="900" y="250" width="100" height="100"/>
  <text class="label" x="950" y="305" text-anchor="middle">Store</text>
  <line class="connector" x1="200" y1="300" x2="300" y2="300" marker-end="url(#arrowhead)"/>
  <line class="connector" x1="400" y1="300" x2="500" y2="300" marker-end="url(#arrowhead)"/>
  <line class="connector" x1="600" y1="300" x2="700" y2="300" marker-end="url(#arrowhead)"/>
  <line class="connector" x1="800" y1="300" x2="900" y2="300" marker-end="url(#arrowhead)"/>
  <circle class="node" cx="600" cy="500" r="20"/>
  <text class="label" x="600" y="505" text-anchor="middle">DLQ</text>
  <line class="connector" x1="600" y1="350" x2="600" y2="480" marker-end="url(#arrowhead)"/>
</svg>
<?xml version="1.0" encoding="UTF-8"?>
<svg width="3840" height="2160" viewBox="0 0 3840 2160" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Barlow+Condensed:wght@400;600;700&family=Libre+Baskerville:wght@400;700&display=swap');
      .row-label { font-family: 'Barlow Condensed', sans-serif; font-size: 48px; font-weight: 700; fill: #E8E0D4; letter-spacing: 0.15em; text-transform: uppercase; }
      .diagram-title { font-family: 'Playfair Display', serif; font-size: 32px; font-weight: 700; fill: #E8E0D4; }
      .diagram-box { stroke: #B8922A; stroke-width: 2; fill: none; }
      .ember-node { fill: #C4501A; r: 6; }
    </style>
    <pattern id="brass_grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="40" y2="0" stroke="#2C2420" stroke-width="0.5"/>
      <line x1="0" y1="0" x2="0" y2="40" stroke="#2C2420" stroke-width="0.5"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="3840" height="2160" fill="#1A1410"/>
  <rect width="3840" height="2160" fill="url(#brass_grid)"/>

  <!-- ROW 1: GLOBAL (y=200) -->
  <text class="row-label" x="1920" y="140" text-anchor="middle">GLOBAL</text>

  <!-- Diagram 1: Multi-Region Architecture -->
  <rect class="diagram-box" x="240" y="200" width="1200" height="800"/>
  <image xlink:href="diagrams/multi_region.svg" x="240" y="200" width="1200" height="800" preserveAspectRatio="xMidYMid meet"/>
  <circle class="ember-node" cx="240" cy="200"/>
  <circle class="ember-node" cx="1440" cy="200"/>
  <circle class="ember-node" cx="240" cy="1000"/>
  <circle class="ember-node" cx="1440" cy="1000"/>
  <text class="diagram-title" x="840" y="1050">Multi-Region Architecture</text>

  <!-- Diagram 2: Region Registry & Proxy Logic -->
  <rect class="diagram-box" x="1560" y="200" width="1200" height="800"/>
  <image xlink:href="diagrams/region_registry.svg" x="1560" y="200" width="1200" height="800" preserveAspectRatio="xMidYMid meet"/>
  <circle class="ember-node" cx="1560" cy="200"/>
  <circle class="ember-node" cx="2760" cy="200"/>
  <circle class="ember-node" cx="1560" cy="1000"/>
  <circle class="ember-node" cx="2760" cy="1000"/>
  <text class="diagram-title" x="2160" y="1050">Region Registry &amp; Proxy Logic</text>

  <!-- ROW 2: PIPELINE (y=1160) -->
  <text class="row-label" x="1920" y="1100" text-anchor="middle">PIPELINE</text>

  <!-- Diagram 3: Harvester Pipeline -->
  <rect class="diagram-box" x="120" y="1160" width="1200" height="800"/>
  <image xlink:href="diagrams/harvester.svg" x="120" y="1160" width="1200" height="800" preserveAspectRatio="xMidYMid meet"/>
  <circle class="ember-node" cx="120" cy="1160"/>
  <circle class="ember-node" cx="1320" cy="1160"/>
  <circle class="ember-node" cx="120" cy="1960"/>
  <circle class="ember-node" cx="1320" cy="1960"/>
  <text class="diagram-title" x="720" y="2010">Harvester Pipeline</text>

  <!-- Diagram 4: Orchestrator Flow -->
  <rect class="diagram-box" x="1440" y="1160" width="1200" height="800"/>
  <image xlink:href="diagrams/orchestrator.svg" x="1440" y="1160" width="1200" height="800" preserveAspectRatio="xMidYMid meet"/>
  <circle class="ember-node" cx="1440" cy="1160"/>
  <circle class="ember-node" cx="2640" cy="1160"/>
  <circle class="ember-node" cx="1440" cy="1960"/>
  <circle class="ember-node" cx="2640" cy="1960"/>
  <text class="diagram-title" x="2040" y="2010">Orchestrator Flow</text>

  <!-- Diagram 5: Queue & DLQ Management -->
  <rect class="diagram-box" x="2760" y="1160" width="1200" height="800"/>
  <image xlink:href="diagrams/queue_dlq.svg" x="2760" y="1160" width="1200" height="800" preserveAspectRatio="xMidYMid meet"/>
  <circle class="ember-node" cx="2760" cy="1160"/>
  <circle class="ember-node" cx="3960" cy="1160"/>
  <circle class="ember-node" cx="2760" cy="1960"/>
  <circle class="ember-node" cx="3960" cy="1960"/>
  <text class="diagram-title" x="3360" y="2010">Queue &amp; DLQ Management</text>

  <!-- ROW 3: SYSTEM-WIDE (y=2120) -->
  <text class="row-label" x="1920" y="2060" text-anchor="middle">SYSTEM-WIDE</text>

  <!-- Note: Row 3 diagrams would extend beyond 2160px height in this layout -->
  <!-- For full implementation, adjust canvas or use alternative layout -->

  <!-- Placeholder boxes for Row 3 -->
  <rect class="diagram-box" x="240" y="2120" width="1200" height="800"/>
  <text class="diagram-title" x="840" y="2560">Reverse Image Search Workflow</text>

  <rect class="diagram-box" x="1560" y="2120" width="1200" height="800"/>
  <text class="diagram-title" x="2160" y="2560">Control Plane Internal Routing</text>

  <rect class="diagram-box" x="2880" y="2120" width="1200" height="800"/>
  <text class="diagram-title" x="3480" y="2560">Telemetry &amp; Observability</text>

  <!-- CIC Crest Watermark -->
  <text x="3760" y="2120" font-family="Barlow Condensed" font-size="24" fill="#9A9088" opacity="0.22" text-anchor="end">CIC</text>
</svg>
      <rect class="diagram-box" x="300" y="250" width="100" height="100"/>
      <text x="350" y="305" text-anchor="middle" font-family="Barlow Condensed" font-size="14" fill="#9A9088">Parse</text>
      <rect class="diagram-box" x="500" y="250" width="100" height="100"/>
      <text x="550" y="305" text-anchor="middle" font-family="Barlow Condensed" font-size="14" fill="#9A9088">Validate</text>
      <rect class="diagram-box" x="700" y="250" width="100" height="100"/>
      <text x="750" y="305" text-anchor="middle" font-family="Barlow Condensed" font-size="14" fill="#9A9088">Enrich</text>
      <rect class="diagram-box" x="900" y="250" width="100" height="100"/>
      <text x="950" y="305" text-anchor="middle" font-family="Barlow Condensed" font-size="14" fill="#9A9088">Store</text>
      <line stroke="#B8922A" stroke-width="1.5" x1="200" y1="300" x2="300" y2="300"/>
      <line stroke="#B8922A" stroke-width="1.5" x1="400" y1="300" x2="500" y2="300"/>
      <line stroke="#B8922A" stroke-width="1.5" x1="600" y1="300" x2="700" y2="300"/>
      <line stroke="#B8922A" stroke-width="1.5" x1="800" y1="300" x2="900" y2="300"/>
      <circle class="ember-node" cx="600" cy="500" r="20"/>
      <text x="600" y="505" text-anchor="middle" font-family="Barlow Condensed" font-size="14" fill="#9A9088">DLQ</text>
      <line stroke="#B8922A" stroke-width="1.5" x1="600" y1="350" x2="600" y2="480"/>
    </g>

      <rect class="diagram-box" x="100" y="300" width="120" height="80"/>
      <text x="160" y="345" text-anchor="middle" font-family="Barlow Condensed" font-size="14" fill="#9A9088">Request</text>
      <rect class="diagram-box" x="300" y="250" width="160" height="180"/>
      <text x="380" y="345" text-anchor="middle" font-family="Barlow Condensed" font-size="14" fill="#9A9088">Region Registry</text>
      <circle class="ember-node" cx="600" cy="140" r="20"/>
      <text x="600" y="145" text-anchor="middle" font-family="Barlow Condensed" font-size="14" fill="#9A9088">P1</text>
      <line stroke="#B8922A" stroke-width="1.5" x1="460" y1="340" x2="580" y2="140"/>
      <circle class="ember-node" cx="600" cy="340" r="20"/>
      <text x="600" y="345" text-anchor="middle" font-family="Barlow Condensed" font-size="14" fill="#9A9088">P2</text>
      <line stroke="#B8922A" stroke-width="1.5" x1="460" y1="340" x2="580" y2="340"/>
      <circle class="ember-node" cx="600" cy="540" r="20"/>
      <text x="600" y="545" text-anchor="middle" font-family="Barlow Condensed" font-size="14" fill="#9A9088">P3</text>
      <line stroke="#B8922A" stroke-width="1.5" x1="460" y1="340" x2="580" y2="540"/>
      <rect class="diagram-box" x="750" y="250" width="140" height="180"/>
      <text x="820" y="330" text-anchor="middle" font-family="Barlow Condensed" font-size="14" fill="#9A9088">Route</text>
      <text x="820" y="350" text-anchor="middle" font-family="Barlow Condensed" font-size="14" fill="#9A9088">Logic</text>
      <line stroke="#B8922A" stroke-width="1.5" x1="460" y1="340" x2="750" y2="340"/>
    </g>
    <circle class="ember-node" cx="1560" cy="200" r="6"/>
    <circle class="ember-node" cx="2760" cy="200" r="6"/>
    <circle class="ember-node" cx="1560" cy="1000" r="6"/>
    <circle class="ember-node" cx="2760" cy="1000" r="6"/>
  </g>
  <text class="diagram-title" x="2160" y="1050">Region Registry &amp; Proxy Logic</text>

  <!-- ROW 2: PIPELINE (y=1160) -->
  <text class="row-label" x="1920" y="1100" text-anchor="middle">PIPELINE</text>

  <!-- Diagram 3: Harvester Pipeline (INLINED SVG) -->
  <g id="diagram_harvester" data-diagram="harvester">
    <rect class="diagram-box" x="120" y="1160" width="1200" height="800"/>
    <g transform="translate(120, 1160)">
      <rect width="1200" height="800" fill="#1A1410"/>
      <rect class="diagram-box" x="100" y="250" width="100" height="100"/>

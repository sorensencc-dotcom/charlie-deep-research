    <circle class="ember-node" cx="1320" cy="1160" r="6"/>
    <circle class="ember-node" cx="120" cy="1960" r="6"/>
    <circle class="ember-node" cx="1320" cy="1960" r="6"/>
  </g>
  <text class="diagram-title" x="720" y="2010">Harvester Pipeline</text>

  <!-- Diagram 4: Orchestrator Flow (INLINED SVG) -->
  <g id="diagram_orchestrator" data-diagram="orchestrator">
    <rect class="diagram-box" x="1440" y="1160" width="1200" height="800"/>
    <g transform="translate(1440, 1160)">
      <rect width="1200" height="800" fill="#1A1410"/>
      <rect class="diagram-box" x="500" y="250" width="120" height="100"/>
      <text x="560" y="305" text-anchor="middle" font-family="Barlow Condensed" font-size="14" fill="#9A9088">Orchestrator</text>
      <rect class="diagram-box" x="150" y="150" width="120" height="80"/>
      <text x="210" y="195" text-anchor="middle" font-family="Barlow Condensed" font-size="14" fill="#9A9088">Task Queue</text>
      <line stroke="#B8922A" stroke-width="1.5" x1="270" y1="190" x2="500" y2="280"/>
      <circle class="ember-node" cx="700" cy="150" r="25"/>
      <text x="700" y="155" text-anchor="middle" font-family="Barlow Condensed" font-size="14" fill="#9A9088">W</text>
      <line stroke="#B8922A" stroke-width="1.5" x1="620" y1="250" x2="675" y2="150"/>
      <circle class="ember-node" cx="700" cy="300" r="25"/>
      <text x="700" y="305" text-anchor="middle" font-family="Barlow Condensed" font-size="14" fill="#9A9088">W</text>
      <line stroke="#B8922A" stroke-width="1.5" x1="620" y1="300" x2="675" y2="300"/>
      <circle class="ember-node" cx="700" cy="450" r="25"/>
      <text x="700" y="455" text-anchor="middle" font-family="Barlow Condensed" font-size="14" fill="#9A9088">W</text>
      <line stroke="#B8922A" stroke-width="1.5" x1="620" y1="350" x2="675" y2="450"/>
      <rect class="diagram-box" x="150" y="400" width="120" height="80"/>
      <text x="210" y="445" text-anchor="middle" font-family="Barlow Condensed" font-size="14" fill="#9A9088">Status DB</text>
      <line stroke="#B8922A" stroke-width="1.5" x1="560" y1="350" x2="210" y2="400"/>
    </g>
    <circle class="ember-node" cx="1440" cy="1160" r="6"/>
    <circle class="ember-node" cx="2640" cy="1160" r="6"/>
    <circle class="ember-node" cx="1440" cy="1960" r="6"/>
    <circle class="ember-node" cx="2640" cy="1960" r="6"/>
  </g>
  <text class="diagram-title" x="2040" y="2010">Orchestrator Flow</text>

  <!-- Diagram 5: Queue & DLQ Management (INLINED SVG) -->
  <g id="diagram_queue_dlq" data-diagram="queue_dlq">
    <rect class="diagram-box" x="2760" y="1160" width="1200" height="800"/>
    <g transform="translate(2760, 1160)">
      <rect width="1200" height="800" fill="#1A1410"/>
      <rect class="diagram-box" x="200" y="250" width="140" height="100"/>
      <text x="270" y="295" text-anchor="middle" font-family="Barlow Condensed" font-size="14" fill="#9A9088">Primary</text>
      <text x="270" y="315" text-anchor="middle" font-family="Barlow Condensed" font-size="14" fill="#9A9088">Queue</text>
      <circle class="ember-node" cx="500" cy="300" r="25"/>
      <text x="500" y="305" text-anchor="middle" font-family="Barlow Condensed" font-size="14" fill="#9A9088">PROC</text>
      <line stroke="#B8922A" stroke-width="1.5" x1="340" y1="300" x2="475" y2="300"/>
      <rect class="diagram-box" x="700" y="200" width="120" height="80"/>
      <text x="760" y="245" text-anchor="middle" font-family="Barlow Condensed" font-size="14" fill="#9A9088">Success</text>
      <line stroke="#B8922A" stroke-width="1.5" x1="525" y1="280" x2="700" y2="240"/>
      <rect class="diagram-box" x="700" y="400" width="120" height="80"/>
      <text x="760" y="445" text-anchor="middle" font-family="Barlow Condensed" font-size="14" fill="#9A9088">DLQ</text>
      <line stroke="#B8922A" stroke-width="1.5" x1="525" y1="320" x2="700" y2="440"/>
      <rect class="diagram-box" x="200" y="500" width="140" height="80"/>
      <text x="270" y="535" text-anchor="middle" font-family="Barlow Condensed" font-size="14" fill="#9A9088">Retry</text>
      <text x="270" y="555" text-anchor="middle" font-family="Barlow Condensed" font-size="14" fill="#9A9088">Queue</text>
      <line stroke="#B8922A" stroke-width="1.5" x1="270" y1="500" x2="270" y2="350"/>
    </g>
    <circle class="ember-node" cx="2760" cy="1160" r="6"/>
    <circle class="ember-node" cx="3960" cy="1160" r="6"/>
    <circle class="ember-node" cx="2760" cy="1960" r="6"/>
    <circle class="ember-node" cx="3960" cy="1960" r="6"/>
  </g>
  <text class="diagram-title" x="3360" y="2010">Queue &amp; DLQ Management</text>

  <!-- CIC Crest Watermark -->
  <text x="3760" y="2120" font-family="Barlow Condensed" font-size="24" fill="#9A9088" opacity="0.22" text-anchor="end">CIC</text>
</svg>
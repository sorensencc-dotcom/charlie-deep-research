<?xml version="1.0" encoding="UTF-8"?>
<svg width="3840" height="2160" viewBox="0 0 3840 2160" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Barlow+Condensed:wght@400;600;700&family=Libre+Baskerville:wght@400;700&display=swap');
      .row-label { font-family: 'Barlow Condensed', sans-serif; font-size: 48px; font-weight: 700; fill: #E8E0D4; letter-spacing: 0.15em; text-transform: uppercase; }
      .diagram-title { font-family: 'Playfair Display', serif; font-size: 32px; font-weight: 700; fill: #E8E0D4; }
      .diagram-box { stroke: #B8922A; stroke-width: 2; fill: none; }
      .ember-node { fill: #C4501A; }
    </style>
    <pattern id="brass_grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="40" y2="0" stroke="#2C2420" stroke-width="0.5"/>
      <line x1="0" y1="0" x2="0" y2="40" stroke="#2C2420" stroke-width="0.5"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="3840" height="2160" fill="#1A1410"/>
  <rect width="3840" height="2160" fill="url(#brass_grid)"/>

  <!-- ROW 1: GLOBAL (y=200) -->
  <text class="row-label" x="1920" y="140" text-anchor="middle">GLOBAL</text>

  <!-- Diagram 1: Multi-Region Architecture (INLINED SVG) -->
  <g id="diagram_multi_region" data-diagram="multi_region">
    <rect class="diagram-box" x="240" y="200" width="1200" height="800"/>
    <g transform="translate(240, 200)">
      <rect width="1200" height="800" fill="#1A1410"/>
      <circle class="ember-node" cx="600" cy="300" r="30"/>
      <text x="600" y="305" text-anchor="middle" font-family="Barlow Condensed" font-size="14" fill="#9A9088">HUB</text>
      <circle class="ember-node" cx="200" cy="150" r="25"/>
      <text x="200" y="155" text-anchor="middle" font-family="Barlow Condensed" font-size="14" fill="#9A9088">US-E</text>
      <line stroke="#B8922A" stroke-width="1.5" x1="200" y1="150" x2="570" y2="300"/>
      <circle class="ember-node" cx="1000" cy="150" r="25"/>
      <text x="1000" y="155" text-anchor="middle" font-family="Barlow Condensed" font-size="14" fill="#9A9088">US-W</text>
      <line stroke="#B8922A" stroke-width="1.5" x1="1000" y1="150" x2="570" y2="300"/>
      <circle class="ember-node" cx="200" cy="450" r="25"/>
      <text x="200" y="455" text-anchor="middle" font-family="Barlow Condensed" font-size="14" fill="#9A9088">EU</text>
      <line stroke="#B8922A" stroke-width="1.5" x1="200" y1="450" x2="570" y2="300"/>
      <circle class="ember-node" cx="1000" cy="450" r="25"/>
      <text x="1000" y="455" text-anchor="middle" font-family="Barlow Condensed" font-size="14" fill="#9A9088">APAC</text>
      <line stroke="#B8922A" stroke-width="1.5" x1="1000" y1="450" x2="570" y2="300"/>
      <rect class="diagram-box" x="120" y="90" width="160" height="140"/>
      <text x="200" y="165" text-anchor="middle" font-family="Barlow Condensed" font-size="14" fill="#9A9088">Region 1</text>
      <rect class="diagram-box" x="920" y="90" width="160" height="140"/>
      <text x="1000" y="165" text-anchor="middle" font-family="Barlow Condensed" font-size="14" fill="#9A9088">Region 2</text>
      <rect class="diagram-box" x="120" y="390" width="160" height="140"/>
      <text x="200" y="465" text-anchor="middle" font-family="Barlow Condensed" font-size="14" fill="#9A9088">Region 3</text>
      <rect class="diagram-box" x="920" y="390" width="160" height="140"/>
      <text x="1000" y="465" text-anchor="middle" font-family="Barlow Condensed" font-size="14" fill="#9A9088">Region 4</text>
    </g>
    <circle class="ember-node" cx="240" cy="200" r="6"/>
    <circle class="ember-node" cx="1440" cy="200" r="6"/>
    <circle class="ember-node" cx="240" cy="1000" r="6"/>
    <circle class="ember-node" cx="1440" cy="1000" r="6"/>
  </g>
  <text class="diagram-title" x="840" y="1050">Multi-Region Architecture</text>

